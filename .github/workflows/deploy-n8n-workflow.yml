name: Implantar workflows no n8n

on:
  push:
    paths:
      - 'n8n/workflows/*.json'
      - 'n8n/workflows/**/*.json'
      - 'scripts/deploy-n8n-workflow.mjs'
      - 'scripts/patch-whatsapp-router-raw-body.mjs'
      - '.github/workflows/deploy-n8n-workflow.yml'
  workflow_dispatch:
    inputs:
      workflow_file:
        description: Arquivo JSON do workflow; deixe vazio para implantar todos
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-n8n-workflows
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Atualizar leitura do corpo bruto do WhatsApp
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-whatsapp-router-raw-body.mjs
          jq empty n8n/workflows/evolucao-clinica/whatsapp-cloud-webhook-router.json

      - name: Persistir workflow corrigido
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n8n/workflows/evolucao-clinica/whatsapp-cloud-webhook-router.json

          if git diff --cached --quiet; then
            echo "O workflow já contém a leitura correta do corpo bruto."
          else
            git commit -m "fix(n8n): ler corpo bruto do webhook via helper binário"
            git push origin HEAD:main
          fi

      - name: Validar configuração
        shell: bash
        env:
          N8N_BASE_URL: ${{ vars.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${N8N_BASE_URL:-}" ]; then
            echo "A variável N8N_BASE_URL não foi configurada."
            exit 1
          fi

          if [ -z "${N8N_API_KEY:-}" ]; then
            echo "O segredo N8N_API_KEY não foi configurado."
            exit 1
          fi

      - name: Selecionar workflows para implantação
        id: select-workflows
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_WORKFLOW_FILE: ${{ github.event.inputs.workflow_file || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          FILES_FILE="$(mktemp)"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_WORKFLOW_FILE:-}" ]; then
            printf '%s\n' "$INPUT_WORKFLOW_FILE" > "$FILES_FILE"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$CURRENT_SHA" -- \
              'n8n/workflows/**/*.json' \
              'n8n/workflows/*.json' > "$FILES_FILE"

            if git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- \
              'scripts/deploy-n8n-workflow.mjs' \
              'scripts/patch-whatsapp-router-raw-body.mjs' \
              '.github/workflows/deploy-n8n-workflow.yml' | grep -q .; then
              find n8n/workflows -type f -name '*.json' -print | sort -u > "$FILES_FILE"
            fi
          else
            find n8n/workflows -type f -name '*.json' -print | sort -u > "$FILES_FILE"
          fi

          sort -u "$FILES_FILE" -o "$FILES_FILE"

          if [ ! -s "$FILES_FILE" ]; then
            echo "Nenhum workflow JSON foi alterado."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VALID_FILES_FILE="$(mktemp)"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ ! -f "$file" ]; then
              echo "Ignorando workflow removido: $file"
              continue
            fi
            jq empty "$file"
            printf '%s\n' "$file" >> "$VALID_FILES_FILE"
          done < "$FILES_FILE"

          if [ ! -s "$VALID_FILES_FILE" ]; then
            echo "Nenhum workflow existente precisa ser implantado."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Workflows selecionados:"
          cat "$VALID_FILES_FILE"

          {
            echo "has_files=true"
            echo "files<<EOF"
            cat "$VALID_FILES_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Criar ou atualizar workflows
        if: steps.select-workflows.outputs.has_files == 'true'
        shell: bash
        env:
          N8N_BASE_URL: ${{ vars.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          WORKFLOW_FILES: ${{ steps.select-workflows.outputs.files }}
        run: |
          set -euo pipefail

          while IFS= read -r workflow_file; do
            [ -n "$workflow_file" ] || continue
            echo "Implantando ${workflow_file}..."
            N8N_WORKFLOW_FILE="$workflow_file" node scripts/deploy-n8n-workflow.mjs
          done <<< "$WORKFLOW_FILES"
