name: Testar conexão com n8n

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar variáveis obrigatórias
        shell: bash
        env:
          N8N_BASE_URL: ${{ vars.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${N8N_BASE_URL:-}" ]; then
            echo "A variável N8N_BASE_URL não foi configurada."
            exit 1
          fi

          if [ -z "${N8N_API_KEY:-}" ]; then
            echo "O segredo N8N_API_KEY não foi configurado."
            exit 1
          fi

      - name: Testar API pública do n8n
        shell: bash
        env:
          N8N_BASE_URL: ${{ vars.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail

          BASE_URL="${N8N_BASE_URL%/}"
          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --connect-timeout 15 \
            --max-time 45 \
            --header "Accept: application/json" \
            --header "X-N8N-API-KEY: ${N8N_API_KEY}" \
            "${BASE_URL}/api/v1/workflows?limit=1")

          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "Falha ao acessar a API do n8n. HTTP ${HTTP_STATUS}."
            echo "Resposta recebida:"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          if ! jq -e '.data | type == "array"' "$RESPONSE_FILE" >/dev/null; then
            echo "A API respondeu, mas o formato não corresponde ao endpoint de workflows."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          WORKFLOW_COUNT=$(jq '.data | length' "$RESPONSE_FILE")
          echo "Conexão com o n8n validada com sucesso."
          echo "A API retornou ${WORKFLOW_COUNT} workflow(s) nesta consulta de teste."
